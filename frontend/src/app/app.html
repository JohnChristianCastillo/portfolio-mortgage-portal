<header class="topbar">
  <a routerLink="/" class="brand">{{ title() }}</a>

  <nav class="nav">
    <a routerLink="/">Simulate</a>
    <a routerLink="/apply">Apply</a>
    @if (auth.currentUser(); as user) {
      <a routerLink="/applications">My applications</a>
      <span class="current-user">{{ user.email }}</span>
      <button type="button" class="btn btn-outline btn-sm" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/signup">Sign up</a>
      <a routerLink="/login">Log in</a>
    }
    <span
      class="status-dot"
      [class.ok]="backendStatus() === 'ok'"
      [class.error]="backendStatus() === 'unreachable'"
      [title]="'Backend: ' + backendStatus()"
    ></span>
    <app-tier-badge [tier]="gateway.tier()" />
    @if (gatewayStatus.status(); as status) {
      <span class="online-count" title="Sessions currently admitted across the apps behind this gateway">
        {{ status.active.total }} online
      </span>
    }
  </nav>
</header>

<main class="shell">
  @if (gateway.state() === 'admitted') {
    <router-outlet />
  } @else {
    <app-gate />
  }
</main>
